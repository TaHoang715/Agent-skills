version: '3.8'

services:
  # PostgreSQL Database Server
  postgres:
    image: postgres:16-alpine
    container_name: sep490_postgres
    restart: always
    environment:
      POSTGRES_DB: sep490_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: sep490_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # PgAdmin 4 Web GUI for Postgres Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sep490_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sep490.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
